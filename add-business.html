<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>List Your Business – MySehore.in</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      margin: 0;
      padding: 0;
      color: #333;
    }
    .header {
      background: #0d47a1;
      color: white;
      padding: 15px;
      text-align: center;
    }
    .logo span {
      color: #ffcc00;
    }
    .btn-list {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 15px;
      background: #ffcc00;
      color: #0d47a1;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
    }
    .form-section {
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .form-container {
      background: white;
      padding: 30px;
      border-radius: 8px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .form-container h2 {
      margin-bottom: 5px;
    }
    .form-container p {
      margin-top: 0;
      color: #555;
    }
    .form-group {
      margin-bottom: 15px;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    .form-row {
      display: flex;
      gap: 15px;
    }
    .form-row .form-group {
      flex: 1;
    }
    .plan-options {
      display: flex;
      gap: 15px;
      margin-top: 10px;
    }
    .plan-card {
      padding: 10px 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      cursor: pointer;
      flex: 1;
      text-align: center;
      transition: 0.3s;
    }
    .plan-card:hover {
      border-color: #0d47a1;
    }
    .plan-card.gold {
      border-color: gold;
      background: #fff8dc;
    }
    .submit-btn {
      padding: 12px 25px;
      background: #0d47a1;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
      width: 100%;
    }
    .submit-btn:hover {
      background: #08306b;
    }
    .thankyou-message {
      text-align: center;
      padding: 40px;
      font-size: 18px;
      color: #0d47a1;
      display: none;
    }
    .thankyou-message h2 {
      margin-bottom: 10px;
    }
    footer {
      text-align: center;
      padding: 15px;
      background: #0d47a1;
      color: white;
      margin-top: 30px;
    }
    footer a {
      color: #ffcc00;
      text-decoration: none;
    }
  </style>
</head>
<body>

<header class="header">
  <div class="logo"><a href="index.html" style="text-decoration:none; color:white;">My<span>Sehore</span></a></div>
  <a href="index.html" class="btn-list">Back to Home</a>
</header>

<section class="form-section">
  <div class="form-container" id="form-container">
    <h2>अपना बिजनेस रजिस्टर करें</h2>
    <p>सीहोर के हजारों लोगों तक अपनी पहुंच बढ़ाएं।</p>
    <hr>

    <form id="businessForm">
      <div class="form-group">
        <label>Owner Name (मालिक का नाम)</label>
        <input type="text" placeholder="Enter owner name" required>
      </div>

      <div class="form-group">
        <label>Business Name (दुकान/संस्था का नाम)</label>
        <input type="text" placeholder="Enter business name" required>
      </div>

      <div class="form-group">
        <label>Category (कैटेगरी चुनें)</label>
        <select required>
          <option value="">Select Category</option>
          <option value="shops">Shops</option>
          <option value="school">School</option>
          <option value="coaching">Coaching</option>
          <option value="jobs">Jobs/Agency</option>
          <option value="services">Services (Plumber/Electrician)</option>
          <option value="property">Property</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>WhatsApp Number</label>
          <input type="tel" placeholder="91XXXXXXXX" required>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" placeholder="example@mail.com">
        </div>
      </div>

      <div class="form-group">
        <label>Full Address (पूरा पता)</label>
        <textarea rows="3" placeholder="Shop No, Street, Landmark, Sehore..." required></textarea>
      </div>

      <div class="form-group">
        <label>Google Maps Link (Optional)</label>
        <input type="url" placeholder="Paste location link here">
      </div>

      <div class="form-group">
        <label>Business Description (आपके बिजनेस के बारे में जानकारी)</label>
        <textarea rows="4" placeholder="आप क्या-क्या सर्विस देते हैं?"></textarea>
      </div>

      <div class="plan-selection">
        <label>Choose Listing Plan:</label>
        <div class="plan-options">
          <label class="plan-card">
            <input type="radio" name="plan" value="free" checked>
            <span>Standard (Free)</span>
          </label>
          <label class="plan-card gold">
            <input type="radio" name="plan" value="premium">
            <span>Featured Listing (Paid) ★</span>
          </label>
        </div>
      </div>

      <button type="submit" class="submit-btn">Submit for Verification</button>
    </form>

    <div class="thankyou-message" id="thankyou-message">
      <h2>Thank You!</h2>
      <p>Your business registration request has been received. Our team will contact you shortly for verification.</p>
      <p>We appreciate your trust in <strong>MySehore.in</strong>.</p>
    </div>
  </div>
</section>

<footer>© 2026 <a href="index.html">MySehore.in</a></footer>
<form action="https://formspree.io/f/xeegngbw" method="POST">
  <input type="text" name="business_name" required>
  <input type="tel" name="phone" required>
  <button type="submit">Submit</button>
</form>
<script>
  const form = document.getElementById('businessForm');
  const thankYou = document.getElementById('thankyou-message');
  const formContainer = document.getElementById('form-container');

  form.addEventListener('submit', function(e) {
    e.preventDefault(); // Prevent default page reload
    form.style.display = 'none'; // Hide form
    thankYou.style.display = 'block'; // Show thank you message
  });
</script>

</body>
</html>
